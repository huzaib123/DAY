<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121a33">
  <meta name="robots" content="noindex, nofollow">
  <title>Operation 11·10</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand" id="brand">Operation 11·10</div>
      <div class="signal" id="signal" role="status" aria-live="polite"><span class="dot"></span><span id="signal-text">Online</span></div>
    </header>

    <p class="notice" id="offline-notice"></p>

    <ol class="route" id="route" aria-label="Mission progress"></ol>

    <main id="view" tabindex="-1"></main>

    <details class="notebook" id="notebook" open>
      <summary>Code notebook <span class="count" id="nb-count"></span></summary>
      <ul id="nb-list"></ul>
      <p class="nb-foot">Saved on this phone. Nothing here is lost if the signal drops.</p>
    </details>
  </div>

  <canvas id="confetti" hidden></canvas>

  <script src="js/config.js"></script>
  <script src="js/outbox.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
